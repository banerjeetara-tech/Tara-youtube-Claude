<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>My Feed</title>
<style>
:root{
  --bg:#f4f5f7; --bg2:#eceef1; --card:#ffffff; --card2:#f8f9fb;
  --ink:#1f2533; --ink-dim:#6b7280; --line:#e4e7ec;
  --theme:#10b981; --theme2:#34d399;
  --brand:var(--theme); --brand2:var(--theme2); --accent:#f59e0b;
  --t-new:#10b981; --t-foryou:#8b5cf6; --t-search:#f59e0b; --t-browse:#ec4899; --t-manage:#14b8a6;
  --shadow:0 10px 26px rgba(40,45,60,.11);
  --shadow-sm:0 3px 10px rgba(40,45,60,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%;max-width:100%}
img{max-width:100%}
body{
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(860px 460px at 92% -8%, rgba(139,92,246,.10), transparent 58%),
    radial-gradient(800px 430px at -8% 4%, rgba(16,185,129,.10), transparent 55%),
    radial-gradient(680px 410px at 50% 114%, rgba(236,72,153,.06), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  min-height:100vh;
}

/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 11px;
  background:linear-gradient(180deg, rgba(247,246,243,.97), rgba(247,246,243,.72) 75%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand2) 60%,#54b89f);
  display:grid;place-items:center;font-size:17px;color:#fff;box-shadow:var(--shadow)}
.htxt h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.4px}
.htxt p{margin:1px 0 0;font-size:11px;color:var(--ink-dim)}
.refresh{margin-left:auto;border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  border-radius:12px;padding:9px 14px;font-size:13px;font-weight:800;display:flex;gap:7px;align-items:center;box-shadow:var(--shadow-sm)}
.refresh:active{transform:scale(.95)}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}

/* view title */
.vhead{padding:16px 18px 2px;max-width:840px;margin:0 auto}
.vhead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.vhead h2::after{content:"";display:block;width:44px;height:4px;border-radius:3px;background:var(--tc,var(--theme));margin-top:9px}
.vhead p{margin:5px 0 0;font-size:12.5px;color:var(--ink-dim);line-height:1.45;max-width:90%}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:13px 16px 4px;scrollbar-width:none;max-width:840px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;gap:7px;align-items:center;box-shadow:var(--shadow-sm)}
.chip .d{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--cc,var(--theme));color:#fff;border-color:var(--cc,var(--theme))}
.chip.on .d{filter:brightness(2)}
.chip .n{font-size:11px;opacity:.65;font-weight:800}

/* clear-all bar */
.barrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 10px}
.barrow .cnt{font-size:12px;color:var(--ink-dim);font-weight:600}
.clrbtn{border:1.5px solid var(--theme);background:transparent;color:var(--theme);
  border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:800;white-space:nowrap}
.clrbtn:active{transform:scale(.94)}

.toolbar{padding:8px 16px 2px;max-width:840px;margin:0 auto}
.input{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  border-radius:13px;padding:13px 15px;font-size:15px;outline:none;box-shadow:var(--shadow-sm)}
.input:focus{border-color:var(--brand2)}
.input::placeholder{color:var(--ink-dim)}
.row .input{flex:1;min-width:0;width:auto}

main{padding:8px 16px 100px;max-width:840px;margin:0 auto}

.status{font-size:12px;color:var(--ink-dim);padding:6px 2px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600}

/* card */
.card{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:17px;
  padding:11px;margin-bottom:12px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;animation:rise .32s ease both}
.card:active{transform:scale(.992)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.thumb{position:relative;flex:none;width:142px;height:84px;border-radius:12px;overflow:hidden;background:#e9e0d0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.32));font-size:24px;color:#fff;opacity:.92}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.cpill{align-self:flex-start;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  padding:3px 8px;border-radius:7px;margin-bottom:5px}
.vtitle{font-size:14px;font-weight:700;line-height:1.3;margin:0 0 4px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vchan{font-size:11.5px;color:var(--ink-dim);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vtime{font-size:11px;color:var(--ink-dim);margin-top:auto;opacity:.85;padding-top:3px}
.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.act{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  border-radius:9px;padding:6px 11px;font-size:11.5px;font-weight:700;display:flex;gap:4px;align-items:center;text-decoration:none}
.act:active{transform:scale(.93)}
.act.go{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}
.act.warn{color:var(--accent)}

/* manage */
.crow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.crow .dot{width:11px;height:11px;border-radius:50%;flex:none}
.crow b{font-size:13.5px;font-weight:700;display:block;line-height:1.25}
.crow small{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.crow .x{margin-left:auto;border:1px solid var(--line);background:var(--card2);color:var(--accent);
  border-radius:10px;width:36px;height:36px;font-size:17px;font-weight:800;flex:none}
.crow .x:active{transform:scale(.9)}
.addbox{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:16px;padding:15px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.addbox b{font-size:14.5px}
.addbox .row{display:flex;gap:8px;margin-top:10px}
.sel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:0 11px;font-size:13px;font-weight:700}
.btn{border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:12px;
  padding:12px 17px;font-size:14px;font-weight:800;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.55}
.note{font-size:11.5px;color:var(--ink-dim);line-height:1.5;margin-top:10px}

.glabel{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-dim);
  margin:18px 2px 9px;display:flex;align-items:center;gap:8px}
.glabel .d{width:9px;height:9px;border-radius:50%}

.empty{text-align:center;color:var(--ink-dim);padding:44px 20px;font-size:13.5px;line-height:1.6}
.empty .big{font-size:40px;margin-bottom:12px}
.loader{display:grid;place-items:center;padding:44px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--brand);animation:bb 1s infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--accent)}.dots i:nth-child(3){animation-delay:.3s;background:#cf9536}
@keyframes bb{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
  background:linear-gradient(0deg, var(--card), rgba(255,250,242,.9));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:none;color:var(--ink-dim);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;font-weight:800;padding:7px 2px;position:relative;border-radius:14px;margin:0 2px;transition:.15s}
.nav .ic{font-size:20px;line-height:1}
.nav button.on{color:#fff;background:var(--tc);box-shadow:var(--shadow-sm)}
.nav button.on .ic{transform:scale(1.05)}
.nav .badge{position:absolute;top:1px;right:50%;transform:translateX(18px);background:var(--accent);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 5px rgba(0,0,0,.2)}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:13px;font-weight:700;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow);max-width:82%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* compact fit for phones */
@media (max-width:430px){
  .vhead{padding:12px 16px 0}
  .vhead h2{font-size:21px}
  .vhead p{font-size:11.5px;max-width:100%}
  .thumb{width:118px;height:70px}
  .card{gap:11px;padding:9px;border-radius:14px;margin-bottom:10px}
  .vtitle{font-size:13px}
  .act{padding:6px 9px;font-size:11px}
  .chips{padding:10px 14px 2px}
  main{padding:6px 14px 96px}
}
@media (max-width:360px){
  .thumb{width:104px;height:62px}
  .act{padding:5px 8px;font-size:10.5px}
}
</style>
</head>

const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let WATCHED=new Set(LS.get('yf_watched',[]));
let TOWATCH=LS.get('yf_towatch',[]);
let CACHE=LS.get('yf_cache',{});
let SEENRAW=LS.get('yf_seen',null);
let SEEN=new Set(SEENRAW||[]);
let INBOX=LS.get('yf_inbox',[]);
let ADDED=LS.get('yf_added',[]);
let REMOVED=new Set(LS.get('yf_removed',[]));
let DISMISSED=new Set(LS.get('yf_dismissed',[]));
const saveDis=()=>LS.set('yf_dismissed',[...DISMISSED]);
const saveW=()=>LS.set('yf_watched',[...WATCHED]);
const saveT=()=>LS.set('yf_towatch',TOWATCH);
const saveSeen=()=>LS.set('yf_seen',[...SEEN]);
const saveInbox=()=>LS.set('yf_inbox',INBOX);
const saveCache=()=>LS.set('yf_cache',CACHE);
const saveAdded=()=>LS.set('yf_added',ADDED);
const saveRemoved=()=>LS.set('yf_removed',[...REMOVED]);
const savePool=()=>LS.set('yf_pool',S.pool.slice(0,700));

let CH=[];
function rebuildCH(){
  const base=CHANNELS.map(c=>({id:c[0],title:c[1],cat:c[2]})).filter(c=>!REMOVED.has(c.id));
  const ids=new Set(base.map(c=>c.id));
  CH=[...base,...ADDED.filter(c=>!ids.has(c.id)&&!REMOVED.has(c.id))];
}
rebuildCH();

/* ---------- proxies + fetch ---------- */
const FEED=id=>'https://www.youtube.com/feeds/videos.xml?channel_id='+id;
const PROXIES=[
  id=>`https://api.allorigins.win/raw?url=${encodeURIComponent(FEED(id))}`,
  id=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(FEED(id))}`,
  id=>`https://corsproxy.io/?url=${encodeURIComponent(FEED(id))}`,
  id=>`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(FEED(id))}`,
];
let BEST=-1; // index of proxy that worked first
async function timedFetch(u,ms){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),ms||7000);
  try{return await fetch(u,{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(to)}
}
function order(){ // try BEST first, then the rest
  const idx=[...PROXIES.keys()];
  if(BEST>=0){idx.splice(idx.indexOf(BEST),1);idx.unshift(BEST);}
  return idx;
}
async function fetchChannel(ch){
  const c=CACHE[ch.id];
  if(c&&(Date.now()-c.t<30*60*1000))return c.items;
  for(const pi of order()){
    try{
      const r=await timedFetch(PROXIES[pi](ch.id));if(!r.ok)continue;
      const ct=r.headers.get('content-type')||'';let items=[];
      if(ct.includes('json')){
        const j=await r.json();
        if(j.items)items=j.items.map(it=>mkEntry({title:it.title,link:it.link,pub:it.pubDate,
          id:(it.guid||it.link||'').split(':').pop(),thumb:it.thumbnail||(it.enclosure&&it.enclosure.link)||''},ch));
        else continue;
      }else items=parseXML(await r.text(),ch);
      if(items.length){items=items.slice(0,8);if(BEST<0)BEST=pi;CACHE[ch.id]={t:Date.now(),items};saveCache();return items;}
    }catch(e){}
  }
  return c?c.items:[];
}
function vidId(link){const m=(link||'').match(/[?&]v=([^&]+)/)||(link||'').match(/watch\?v=([\w-]+)/);return m?m[1]:(link||'').split('/').pop()}
function mkEntry(e,ch){const id=vidId(e.link)||e.id;return{vid:id,title:e.title||'(untitled)',
  link:e.link||('https://youtu.be/'+id),chan:ch.title,cid:ch.id,cat:ch.cat,
  thumb:e.thumb||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ts:e.pub?new Date(e.pub).getTime():0}}
function parseXML(xml,ch){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.getElementsByTagName('entry')].map(en=>{
    const g=t=>{const el=en.getElementsByTagName(t)[0];return el?el.textContent:''};
    const id=(en.getElementsByTagName('yt:videoId')[0]||{}).textContent
      ||vidId((en.getElementsByTagName('link')[0]||{}).getAttribute?.('href'));
    const link=(en.getElementsByTagName('link')[0]||{}).getAttribute?.('href')||('https://youtu.be/'+id);
    const pub=g('published')||g('updated');
    return{vid:id,title:g('title'),link,chan:ch.title,cid:ch.id,cat:ch.cat,
      thumb:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ts:pub?new Date(pub).getTime():0};
  });
}

/* ---------- resolve channel (Add) ---------- */
async function resolveChannel(input){
  input=(input||'').trim();if(!input)return null;
  let id=null,m=input.match(/channel\/(UC[\w-]{20,})/)||input.match(/^(UC[\w-]{20,})$/);
  if(m)id=m[1];
  let url=id?('https://www.youtube.com/channel/'+id)
    :/^https?:\/\//.test(input)?input
    :input.startsWith('@')?('https://www.youtube.com/'+input):('https://www.youtube.com/@'+input);
  for(const mk of [u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
                   u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]){
    try{const r=await timedFetch(mk(url),9000);const t=await r.text();
      if(!id){const mm=t.match(/"(?:channelId|externalId)":"(UC[\w-]+)"/)||t.match(/channel\/(UC[\w-]+)/);if(mm)id=mm[1];}
      let title=null;const tm=t.match(/<meta property="og:title" content="([^"]+)"/)||t.match(/<title>([^<]+?)\s*-\s*YouTube<\/title>/);
      if(tm)title=tm[1].replace(/&amp;/g,'&').replace(/&#0?39;/g,"'").replace(/&#x27;/gi,"'").replace(/&quot;/g,'"');
      if(id)return{id,title:title||input.replace(/^@/,'')};
    }catch(e){}
  }
  return id?{id,title:input.replace(/^@/,'')}:null;
}
/* ---------- resolve a single video (manual add to watch) ---------- */
async function resolveVideo(url){
  const id=vidId(url);if(!id||id.length<6)return null;
  let title='Saved video',author='Saved by me';
  const oe='https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json';
  for(const mk of [u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
                   u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]){
    try{const r=await timedFetch(mk(oe),9000);const j=JSON.parse(await r.text());if(j&&j.title){title=j.title;author=j.author_name||author;break;}}catch(e){}
  }
  return{vid:id,title,link:'https://www.youtube.com/watch?v='+id,chan:author,cid:'manual',cat:'General',
    ts:Date.now(),thumb:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`};
}

/* ---------- state ---------- */
let S={view:'new',cat:'all',foryou:'rec',q:'',mq:'',pool:LS.get('yf_pool',[]),loading:false,feedError:false};

/* ---------- load pool (progressive) ---------- */
async function loadPool(force){
  if(S.loading)return;S.loading=true;document.getElementById('rIcon').classList.add('spin');
  if(force){CACHE={};saveCache();BEST=-1;}
  const hadData=S.pool.length>0;
  if(!hadData)setMain(`<div class="loader"><div style="text-align:center"><div class="dots"><i></i><i></i><i></i></div>
    <div style="margin-top:14px;color:var(--ink-dim);font-size:12.5px" id="ldt">Checking your subscriptions&hellip;</div></div></div>`);
  const out=[];let done=0,painted=false;const batch=12;
  for(let i=0;i<CH.length;i+=batch){
    const res=await Promise.all(CH.slice(i,i+batch).map(fetchChannel));
    res.forEach(a=>out.push(...a));done+=Math.min(batch,CH.length-i);
    if(out.length&&!painted){out.sort((a,b)=>b.ts-a.ts);S.pool=[...out];painted=true;quietRepaint();}
    const lt=document.getElementById('ldt');if(lt)lt.textContent=`Loading\u2026 ${done}/${CH.length} channels`;
  }
  out.sort((a,b)=>b.ts-a.ts);
  S.pool=out;S.loading=false;S.feedError=(out.length===0&&!hadData);
  document.getElementById('rIcon').classList.remove('spin');
  if(out.length){
    savePool();
    const firstRun=(SEENRAW===null);
    const fresh0=out.filter(v=>v.vid&&!SEEN.has(v.vid));
    out.forEach(v=>{if(v.vid)SEEN.add(v.vid)});saveSeen();SEENRAW=[...SEEN];
    let added=0;
    if(!firstRun){
      const fresh=fresh0.filter(v=>!WATCHED.has(v.vid)&&!INBOX.some(x=>x.vid===v.vid));
      INBOX=[...fresh,...INBOX];if(INBOX.length>400)INBOX=INBOX.slice(0,400);added=fresh.length;saveInbox();
    }
    toast(firstRun?'All set \u00b7 new uploads will auto-save here':(added?`\u26a1 ${added} new added`:`Up to date \u00b7 ${out.length} videos`));
  }else if(!hadData){toast('Couldn\u2019t reach feeds \u2014 tap Retry');}
  quietRepaint();
}
function quietRepaint(){if(['new','foryou','browse'].includes(S.view))render();}
async function ensurePool(){if(!S.pool.length)await loadPool();}

/* ---------- recommendations ---------- */
function weights(){const m={};S.pool.forEach(v=>{if(WATCHED.has(v.vid))m[v.chan]=(m[v.chan]||0)+1});
  TOWATCH.forEach(v=>{m[v.chan]=(m[v.chan]||0)+.5});return m}
function recommend(cat){
  const w=weights(),has=Object.keys(w).length>0;
  let p=S.pool.filter(v=>!WATCHED.has(v.vid));if(cat)p=p.filter(v=>v.cat===cat);
  return p.map(v=>{let s=v.ts/1e10;if(w[v.chan])s+=w[v.chan]*5;if(!has&&(v.cat==='AI'||v.cat==='HR'))s+=2;return{...v,_s:s}})
    .sort((a,b)=>b._s-a._s).slice(0,60);
}

/* ---------- card ---------- */
function card(v,i,mode){
  const col=catColor(v.cat);const saved=TOWATCH.some(x=>x.vid===v.vid);
  let acts=`<a class="act go" href="${v.link}" target="_blank" rel="noopener">\u25b6 Watch</a>`;
  if(mode==='watched')acts+=`<button class="act" data-uw="${v.vid}">\u21ba Unwatch</button>`;
  else if(mode==='saved')acts+=`<button class="act" data-w="${v.vid}">\u2713 Done</button><button class="act warn" data-rm="${v.vid}">\u2212 Remove</button>`;
  else acts+=`<button class="act" data-w="${v.vid}">\u2713 Watched</button><button class="act go" data-s='${esc(JSON.stringify(v))}'>${saved?'\u2713 Added':'\uff0b Add'}</button>`;
  return `<div class="card" style="animation-delay:${Math.min(i*18,340)}ms">
    <a class="thumb" href="${v.link}" target="_blank" rel="noopener">
      <img loading="lazy" src="${v.thumb}" onerror="this.src='https://i.ytimg.com/vi/${v.vid}/hqdefault.jpg'"><span class="pl">\u25b6</span></a>
    <div class="meta">
      <span class="cpill" style="background:${col}1A;color:${col}">${v.cat}</span>
      <div class="vtitle">${esc(v.title)}</div>
      <div class="vchan">${esc(v.chan)}</div>
      <div class="vtime">${timeAgo(v.ts)}</div>
      <div class="actions">${acts}</div></div></div>`;
}
function bindCards(scope){
  const root=scope||document;
  root.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const id=b.dataset.w;
    WATCHED.add(id);saveW();INBOX=INBOX.filter(x=>x.vid!==id);saveInbox();TOWATCH=TOWATCH.filter(x=>x.vid!==id);saveT();
    toast('Marked watched');const c=b.closest('.card');if(c)c.style.opacity=.25;setTimeout(render,280);});
  root.querySelectorAll('[data-uw]').forEach(b=>b.onclick=()=>{WATCHED.delete(b.dataset.uw);saveW();toast('Moved back');render();});
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{TOWATCH=TOWATCH.filter(x=>x.vid!==b.dataset.rm);saveT();toast('Removed');render();});
  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const v=JSON.parse(b.dataset.s.replace(/&#39;/g,"'"));
    if(TOWATCH.some(x=>x.vid===v.vid)){TOWATCH=TOWATCH.filter(x=>x.vid!==v.vid);toast('Removed from To-Watch');}
    else{TOWATCH.push(v);toast('\u2b50 Added to To-Watch');}saveT();b.textContent=TOWATCH.some(x=>x.vid===v.vid)?'\u2713 Added':'\uff0b Add';renderNav();});
}

/* ---------- list helpers ---------- */
function statusLine(n){return `<div class="status"><span class="pill">${n} videos</span>
  <span class="pill">${INBOX.length} new</span><span class="pill">${TOWATCH.length} saved</span><span class="pill">${WATCHED.size} watched</span></div>`}
function listHTML(list,mode,ic,t,sub){
  if(!list.length)return `<div class="empty"><div class="big">${ic}</div><b>${t}</b><br>${sub}</div>`;
  return statusLine(list.length)+list.map((v,i)=>card(v,i,mode)).join('');
}

function setHead(t,sub,col){const el=document.getElementById('vhead');
  el.style.setProperty('--tc',col||'var(--theme)');
  el.innerHTML=`<h2>${t}</h2>${sub?`<p>${sub}</p>`:''}`}
function showChips(items,active,pick){
  const el=document.getElementById('chips');el.style.display='flex';
  el.innerHTML=items.map(c=>{const on=active===c.k;
    return `<button class="chip ${on?'on':''}" data-k="${c.k}" style="${on&&c.d?`--cc:${c.d}`:''}">
    ${c.d?`<span class="d" style="background:${c.d}"></span>`:''}${c.label}${c.n!=null?`<span class="n">${c.n}</span>`:''}</button>`}).join('');
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(b.dataset.k));
}
function hideChips(){document.getElementById('chips').style.display='none'}
function clearBar(col,label){return `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
  <button class="act" id="clearAll" style="background:${col};color:#fff;border:none">\uD83D\uDDD1 ${label||'Clear all'}</button></div>`}
function onClear(fn){const b=document.getElementById('clearAll');if(b)b.onclick=fn;}function showToolbar(h){const t=document.getElementById('toolbar');t.style.display='block';t.innerHTML=h}
function hideToolbar(){const t=document.getElementById('toolbar');t.style.display='none';t.innerHTML=''}

async function render(){
  renderNav();updateSub();
  const v=S.view;
  if(['new','foryou','search','browse'].includes(v))await ensurePool();
  if(v==='new')return viewNew();
  if(v==='foryou')return viewForYou();
  if(v==='search')return viewSearch();
  if(v==='browse')return viewBrowse();
  if(v==='manage')return viewManage();
}

/* ---- New ---- */
function viewNew(){
  hideChips();hideToolbar();
  INBOX=INBOX.filter(v=>!WATCHED.has(v.vid));saveInbox();
  setHead('\uD83C\uDD95 New Drops','Fresh videos & podcasts from your subscriptions, auto-collected. They stay until you mark them watched.',TCOL.new);
  const m=document.getElementById('main');
  if(!INBOX.length){
    m.innerHTML=S.feedError
      ?`<div class="empty"><div class="big">\uD83D\uDCE1</div><b>Couldn\u2019t reach your feeds</b><br>The free servers can be busy. Try again.<br><button class="btn" id="retry" style="margin-top:16px">\u21bb Retry now</button></div>`
      :`<div class="empty"><div class="big">\uD83D\uDD14</div><b>No new drops yet</b><br>New uploads will appear here automatically on Refresh.</div>`;
  }else{
    m.innerHTML=clearBar(TCOL.new)+statusLine(INBOX.length)+INBOX.map((v,i)=>card(v,i,'feed')).join('');
    bindCards();onClear(()=>{INBOX=[];saveInbox();toast('Cleared');render();});
  }
  const r=document.getElementById('retry');if(r)r.onclick=async()=>{S.pool=[];await loadPool(true);render();};
}

/* ---- For You ---- */
function viewForYou(){
  hideToolbar();
  if(!['rec','AI','HR'].includes(S.foryou))S.foryou='rec';
  showChips(FORYOU,S.foryou,k=>{S.foryou=k;render();});
  setHead('\u2728 For You', S.foryou==='rec'?'Recommended from your subscriptions, ranked by what you watch.'
    :S.foryou==='AI'?'AI videos ranked for you.':'HR videos ranked for you.',TCOL.foryou);
  const list=recommend(S.foryou==='rec'?null:S.foryou);
  document.getElementById('main').innerHTML=(list.length?clearBar(TCOL.foryou,'Clear these'):'')+listHTML(list,'feed','\uD83C\uDF31',
    S.loading?'Loading\u2026':'Nothing to recommend yet','Watch a few videos and this fills up.');
  bindCards();
  onClear(()=>{if(confirm('Hide all of these picks? (marks them watched)')){list.forEach(v=>WATCHED.add(v.vid));saveW();toast('Cleared');render();}});
}

/* ---- Search ---- */
function viewSearch(){
  hideChips();
  setHead('\uD83D\uDD0D Search','Find any recent video from your subscriptions \u2014 or search YouTube.',TCOL.search);
  showToolbar(`<input class="input" id="sIn" placeholder="Search videos & channels\u2026" value="${esc(S.q)}">`);
  const inp=document.getElementById('sIn');
  inp.oninput=()=>{S.q=inp.value;paintSearch();};
  document.getElementById('main').innerHTML=`<div id="sres"></div>`;
  paintSearch();
}
function paintSearch(){
  const q=S.q.trim();const ql=q.toLowerCase();const box=document.getElementById('sres');if(!box)return;
  if(!q){box.innerHTML=`<div class="empty"><div class="big">\uD83D\uDD0E</div><b>Type to search</b><br>Search ${S.pool.length} recent videos by title or channel.</div>`;return;}
  const yt=`<a class="act go" style="margin:2px 0 14px" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">\u25b6 Search \u201c${esc(q)}\u201d on YouTube</a>`;
  const chans=[...new Set(S.pool.map(v=>v.chan))].filter(c=>c.toLowerCase().includes(ql)).slice(0,10);
  const vids=S.pool.filter(v=>(v.title||'').toLowerCase().includes(ql)||(v.chan||'').toLowerCase().includes(ql)).slice(0,80);
  let html=yt;
  if(chans.length){
    html+=`<div class="glabel">Channels</div><div class="chips" style="padding:0 0 4px">`+
      chans.map(c=>{const ch=CH.find(x=>x.title===c);const col=ch?catColor(ch.cat):'var(--brand)';
        return `<a class="chip" style="text-decoration:none" href="https://www.youtube.com/channel/${ch?ch.id:''}/videos" target="_blank" rel="noopener"><span class="d" style="background:${col}"></span>${esc(c)}</a>`}).join('')+`</div>`;
  }
  html+=`<div class="glabel">Videos</div>`+listHTML(vids,'feed','\uD83C\uDF43','No videos match','Use the YouTube button above to search the web.');
  box.innerHTML=clearBar(TCOL.search,'Clear search')+html;bindCards(box);
  onClear(()=>{S.q='';const i=document.getElementById('sIn');if(i)i.value='';paintSearch();});
}

/* ---- Browse ---- */

    onClear(()=>{if(confirm('Remove all saved videos?')){TOWATCH=[];saveT();toast('Cleared');render();}});
    const vIn=document.getElementById('vIn'),vAdd=document.getElementById('vAdd'),vNote=document.getElementById('vNote');
    vAdd.onclick=async()=>{const u=vIn.value.trim();if(!u){vNote.textContent='Paste a link first.';return;}
      vAdd.disabled=true;vAdd.textContent='Adding\u2026';vNote.textContent='Fetching video\u2026';
      const v=await resolveVideo(u);
      if(!v){vAdd.disabled=false;vAdd.textContent='Add to To-Watch';vNote.textContent='That doesn\u2019t look like a YouTube link.';return;}
      if(TOWATCH.some(x=>x.vid===v.vid)){vAdd.disabled=false;vAdd.textContent='Add to To-Watch';vNote.textContent='Already in your list.';return;}
      TOWATCH.push(v);saveT();vIn.value='';vAdd.disabled=false;vAdd.textContent='Add to To-Watch';
      vNote.textContent='Added!';toast('Added to To-Watch');render();};
    vIn.addEventListener('keydown',e=>{if(e.key==='Enter')vAdd.click();});
    return;
  }
  if(S.cat==='watched'){const w=S.pool.filter(v=>WATCHED.has(v.vid));
    m.innerHTML=(w.length?clearBar(bcol,'Clear history'):'')+listHTML(w,'watched','\u2713','Nothing watched yet','Mark videos watched and they appear here.');
    bindCards();onClear(()=>{if(confirm('Clear your entire watched history?')){WATCHED=new Set();saveW();toast('History cleared');render();}});return;}
  let list=S.pool.filter(v=>!WATCHED.has(v.vid));
  if(S.cat!=='all')list=list.filter(v=>v.cat===S.cat);
  list=list.slice(0,90);
  m.innerHTML=(list.length?clearBar(bcol,'Mark all watched'):'')+listHTML(list,'feed','\uD83C\uDF43',S.loading?'Loading\u2026':'Nothing here yet','Tap Refresh, or add channels in Subs.');
  bindCards();
  onClear(()=>{if(confirm('Mark all shown videos as watched?')){list.forEach(v=>WATCHED.add(v.vid));saveW();toast('Marked watched');render();}});
}

/* ---- Manage ---- */
function viewManage(){
  hideChips();
  setHead('\u2699\uFE0F Subscriptions','Add or remove channels. Saved on your phone.',TCOL.manage);
  showToolbar(`<input class="input" id="mIn" placeholder="Filter your channels\u2026" value="${esc(S.mq)}">`);
  const mIn=document.getElementById('mIn');mIn.oninput=()=>{S.mq=mIn.value;paintManageList();};
  document.getElementById('main').innerHTML=`
    <div class="addbox"><b>\u2795 Add a channel</b>
      <div class="row"><input class="input" id="addIn" placeholder="Paste channel link, @handle or ID"></div>
      <div class="row"><select class="sel" id="addCat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
        <button class="btn" id="addBtn" style="flex:1">Add channel</button></div>
      <div class="note" id="addNote">Most reliable: paste the link with \u201c/channel/UC\u2026\u201d or the UC\u2026 ID. @handles work too.</div></div>
    ${(REMOVED.size||ADDED.length)?clearBar(TCOL.manage,'Reset all changes'):''}
    <div id="mlist"></div>`;
  paintManageList();
  onClear(()=>{if(confirm('Restore all original channels and remove your custom changes?')){REMOVED=new Set();ADDED=[];saveRemoved();saveAdded();rebuildCH();S.pool=[];toast('Reset to defaults');updateSub();render();}});
  const addBtn=document.getElementById('addBtn'),addIn=document.getElementById('addIn'),addCat=document.getElementById('addCat'),note=document.getElementById('addNote');
  addBtn.onclick=async()=>{const val=addIn.value.trim();if(!val){note.textContent='Paste a channel link, @handle or ID first.';return;}
    addBtn.disabled=true;addBtn.textContent='Adding\u2026';note.textContent='Looking up the channel\u2026';
    const res=await resolveChannel(val);
    if(!res){addBtn.disabled=false;addBtn.textContent='Add channel';note.textContent='Couldn\u2019t find it. Paste the full \u201c/channel/UC\u2026\u201d link or the UC\u2026 ID.';return;}
    if(CH.some(c=>c.id===res.id)){addBtn.disabled=false;addBtn.textContent='Add channel';note.textContent='That channel is already in your list.';return;}
    REMOVED.delete(res.id);saveRemoved();ADDED.push({id:res.id,title:res.title,cat:addCat.value});saveAdded();rebuildCH();
    delete CACHE[res.id];saveCache();
    addIn.value='';addBtn.disabled=false;addBtn.textContent='Add channel';note.textContent=`Added \u201c${res.title}\u201d. Pull Refresh to load its videos.`;
    toast('Channel added');updateSub();paintManageList();renderNav();};
  addIn.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();});
}
function paintManageList(){
  const box=document.getElementById('mlist');if(!box)return;
  const q=S.mq.trim().toLowerCase();
  let html=`<div class="status"><span class="pill">${CH.length} channels</span>${ADDED.length?`<span class="pill">${ADDED.length} added by you</span>`:''}</div>`;
  CATS.forEach(cat=>{
    let rows=CH.filter(c=>c.cat===cat&&(!q||c.title.toLowerCase().includes(q)));
    if(!rows.length)return;rows.sort((a,b)=>a.title.localeCompare(b.title));
    html+=`<div class="glabel"><span class="d" style="background:${catColor(cat)}"></span>${cat} \u00b7 ${rows.length}</div>`;
    html+=rows.map(c=>{const mine=ADDED.some(a=>a.id===c.id);
      return `<div class="crow"><span class="dot" style="background:${catColor(c.cat)}"></span>
        <div><b>${esc(c.title)}</b><small>${c.cat}${mine?' \u00b7 added by you':''}</small></div>
        <button class="x" data-del="${c.id}">\u00d7</button></div>`}).join('');
  });
  box.innerHTML=html;
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;
    if(ADDED.some(a=>a.id===id)){ADDED=ADDED.filter(a=>a.id!==id);saveAdded();}else{REMOVED.add(id);saveRemoved();}
    rebuildCH();S.pool=S.pool.filter(v=>v.cid!==id);savePool();
    toast('Channel removed');updateSub();paintManageList();renderNav();});
}

/* ---------- utils ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function timeAgo(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;
  if(s<3600)return Math.max(1,Math.floor(s/60))+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<86400*7)return Math.floor(s/86400)+'d ago';if(s<86400*30)return Math.floor(s/86400/7)+'w ago';return Math.floor(s/86400/30)+'mo ago'}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1700)}
function setMain(h){document.getElementById('main').innerHTML=h}

/* ---------- init ---------- */
document.getElementById('refreshBtn').onclick=async()=>{S.pool=[];await loadPool(true);render();};
render();
if(S.pool.length)loadPool(); // had cached pool -> refresh in background
let lastCheck=Date.now();
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&Date.now()-lastCheck>5*60*1000){
    lastCheck=Date.now();if(['new','foryou','search','browse'].includes(S.view)){await loadPool();}
  }
});
</script>
