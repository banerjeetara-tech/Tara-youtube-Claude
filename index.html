<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Feed — My subscriptions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f0; --bg2:#e7eae3; --card:#ffffff; --card2:#f6f8f4;
  --ink:#1b1f1b; --ink-dim:#79817a; --line:#e1e5dd;
  --brand:#1f5b45; --brand2:#2d7d5f; --brand-d:#163f2f; --accent:#b0573f;
  --shadow:0 10px 26px rgba(30,60,45,.10); --shadow-sm:0 2px 9px rgba(30,60,45,.07);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%;max-width:100%}
img{max-width:100%}
body{-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}

/* header */
header{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top) + 14px) 18px 8px;
  background:linear-gradient(180deg, var(--bg) 70%, rgba(247,244,239,0));}
.brandrow{display:flex;align-items:flex-end;gap:12px}
.brand{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:-1px;line-height:.9;color:var(--ink)}
.brand .dot{color:var(--brand)}
.live{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--brand)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.icbtn{border:none;background:none;color:var(--ink-dim);font-size:21px;padding:4px 6px}
.icbtn:active{transform:scale(.9)}
.icbtn .sp{display:inline-block}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sub{margin:6px 0 0;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-dim)}

/* chips */
.chips{display:flex;gap:9px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink-dim);
  border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;white-space:nowrap;font-family:var(--serif)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* search */
.toolbar{padding:10px 16px 2px}
.search{position:relative}
.search input{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  border-radius:14px;padding:13px 15px 13px 42px;font-size:15px;outline:none;box-shadow:var(--shadow-sm)}
.search input:focus{border-color:var(--brand)}
.search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-dim);font-size:15px}
.search input::placeholder{color:var(--ink-dim)}

main{padding:8px 16px 100px;max-width:840px;margin:0 auto}

.topbar{display:flex;justify-content:flex-end;gap:8px;margin:4px 0 12px}
.status{font-size:12px;color:var(--ink-dim);padding:2px 2px 12px;display:flex;gap:7px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600}

/* card — editorial, left accent */
.card{position:relative;display:flex;gap:13px;background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--ac,var(--brand));border-radius:14px;padding:14px 15px;margin-bottom:13px;
  box-shadow:var(--shadow-sm);overflow:hidden;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column}
.crow1{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.badge{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;
  background:var(--ac,var(--brand));color:#fff;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11.5px;color:var(--ink-dim);font-weight:600}
.vtitle{font-family:var(--serif);font-weight:800;font-size:19px;line-height:1.18;letter-spacing:-.3px;color:var(--ink);
  margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vchan{font-size:12px;color:var(--ink-dim);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cthumb{flex:none;width:104px;height:64px;border-radius:10px;overflow:hidden;background:var(--bg2);position:relative;align-self:flex-start;margin-top:2px}
.cthumb img{width:100%;height:100%;object-fit:cover;display:block}
.cthumb .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18);color:#fff;font-size:18px}
.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.act{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  padding:7px 12px;font-size:12px;font-weight:700;display:flex;gap:5px;align-items:center;text-decoration:none}
.act:active{transform:scale(.94)}
.act.go{background:var(--brand);color:#fff;border-color:var(--brand)}
.act.warn{color:var(--accent);border-color:var(--accent)}
.act.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* selection */
.selbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:5;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 10px;margin-bottom:13px;box-shadow:var(--shadow-sm)}
.selbar .selcount{font-size:12px;font-weight:800;color:var(--ink-dim);margin-right:auto}
.card.pick{cursor:pointer;align-items:center;border-left-color:var(--ac)}
.card.pick.picked{background:var(--card2);box-shadow:0 0 0 2px var(--brand) inset}
.card .chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.card.pick.picked .chk{background:var(--brand);border-color:var(--brand)}

/* subs */
.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.box h3{font-family:var(--serif);font-weight:800;font-size:18px;margin:0 0 11px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row .inp{flex:1;min-width:0}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:11px 13px;font-size:14px;outline:none}
.inp:focus{border-color:var(--brand)}
.sel{border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:0 10px;font-size:13px;font-weight:700;max-width:42%}
.btn{border:none;background:var(--brand);color:#fff;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:800;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.55}
.note{font-size:11.5px;color:var(--ink-dim);line-height:1.5;margin-top:6px}
.glabel{font-family:var(--serif);font-size:15px;font-weight:800;color:var(--ink);margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.glabel .d{width:10px;height:10px;border-radius:50%}
.crow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.crow .dot{width:11px;height:11px;border-radius:50%;flex:none}
.crow b{font-size:13.5px;font-weight:700;display:block;line-height:1.25}
.crow .csel{margin-left:auto;border:1px solid var(--line);background:var(--card2);color:var(--ink-dim);border-radius:9px;font-size:11px;font-weight:700;padding:5px 4px;max-width:108px}
.crow .x{border:1px solid var(--line);background:var(--card2);color:var(--accent);border-radius:9px;width:34px;height:34px;font-size:16px;font-weight:800;flex:none}
.crow .x:active{transform:scale(.9)}

.empty{text-align:center;color:var(--ink-dim);padding:46px 20px;font-size:14px;line-height:1.6}
.empty .big{font-size:38px;margin-bottom:12px}
.empty b{font-family:var(--serif);font-size:20px;color:var(--ink)}
.loader{display:grid;place-items:center;padding:46px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--brand);animation:bb 1s infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--accent)}.dots i:nth-child(3){animation-delay:.3s;background:var(--brand2)}
@keyframes bb{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:9px 8px calc(env(safe-area-inset-bottom) + 9px);
  background:linear-gradient(0deg, var(--card), rgba(255,253,250,.92));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:none;color:var(--ink-dim);display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 0;position:relative}
.nav .ic{font-size:21px;line-height:1}
.nav button.on{color:var(--brand)}
.nav button.on .lbl{font-family:var(--serif);font-weight:800}
.nav .badge2{position:absolute;top:-3px;right:50%;transform:translateX(17px);background:var(--accent);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 17px;border-radius:13px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow);max-width:82%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:420px){
  .brand{font-size:30px}
  .vtitle{font-size:17px}
  .cthumb{width:92px;height:58px}
}
</style>
</head>

function allCats(){return [...BASECATS,...CUSTOMCATS.filter(c=>!BASECATS.includes(c))]}
function resolveCat(id,def){if(CATMAP[id])return CATMAP[id];if(def==='News')return 'General';return def||'General'}
function catColor(name){if(CATCOLORS[name])return CATCOLORS[name];let i=allCats().indexOf(name);if(i<0)i=0;return CATPOOL[i%CATPOOL.length]}

let CH=[];
function rebuildCH(){
  const base=CHANNELS.map(c=>({id:c[0],title:c[1],cat:resolveCat(c[0],c[2])})).filter(c=>!REMOVED.has(c.id));
  const ids=new Set(base.map(c=>c.id));
  const add=ADDED.filter(c=>!ids.has(c.id)&&!REMOVED.has(c.id)).map(c=>({id:c.id,title:c.title,cat:resolveCat(c.id,c.cat)}));
  CH=[...base,...add];
}
rebuildCH();
function syncCats(){const m={};CH.forEach(c=>m[c.id]=c.cat);const fix=v=>{if(m[v.cid])v.cat=m[v.cid]};
  S.pool.forEach(fix);INBOX.forEach(fix);SAVED.forEach(fix);savePool();saveInbox();saveSaved();}

/* ---------- proxies + fetch ---------- */
const FEED=id=>'https://www.youtube.com/feeds/videos.xml?channel_id='+id;
const PROXIES=[
  id=>`https://api.allorigins.win/raw?url=${encodeURIComponent(FEED(id))}`,
  id=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(FEED(id))}`,
  id=>`https://corsproxy.io/?url=${encodeURIComponent(FEED(id))}`,
  id=>`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(FEED(id))}`,
];
let BEST=-1;
async function timedFetch(u,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||6000);
  try{return await fetch(u,{cache:'no-store',signal:c.signal})}finally{clearTimeout(t)}}
function order(){const i=[...PROXIES.keys()];if(BEST>=0){i.splice(i.indexOf(BEST),1);i.unshift(BEST)}return i}
async function fetchChannel(ch){
  const c=CACHE[ch.id];if(c&&(Date.now()-c.t<30*60*1000))return c.items;
  for(const pi of order()){
    try{const r=await timedFetch(PROXIES[pi](ch.id));if(!r.ok)continue;
      const ct=r.headers.get('content-type')||'';let items=[];
      if(ct.includes('json')){const j=await r.json();if(j.items)items=j.items.map(it=>mkEntry({title:it.title,link:it.link,pub:it.pubDate,id:(it.guid||it.link||'').split(':').pop(),thumb:it.thumbnail||(it.enclosure&&it.enclosure.link)||''},ch));else continue;}
      else items=parseXML(await r.text(),ch);
      if(items.length){items=items.slice(0,6);if(BEST<0)BEST=pi;CACHE[ch.id]={t:Date.now(),items};saveCache();return items;}
    }catch(e){}
  }
  return c?c.items:[];
}
function vidId(link){const m=(link||'').match(/[?&]v=([^&]+)/)||(link||'').match(/watch\?v=([\w-]+)/);return m?m[1]:(link||'').split('/').pop()}
function mkEntry(e,ch){const id=vidId(e.link)||e.id;return{vid:id,title:e.title||'(untitled)',link:e.link||('https://youtu.be/'+id),
  chan:ch.title,cid:ch.id,cat:ch.cat,thumb:e.thumb||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ts:e.pub?new Date(e.pub).getTime():0}}
function parseXML(xml,ch){const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.getElementsByTagName('entry')].map(en=>{const g=t=>{const el=en.getElementsByTagName(t)[0];return el?el.textContent:''};
    const id=(en.getElementsByTagName('yt:videoId')[0]||{}).textContent||vidId((en.getElementsByTagName('link')[0]||{}).getAttribute?.('href'));
    const link=(en.getElementsByTagName('link')[0]||{}).getAttribute?.('href')||('https://youtu.be/'+id);
    const pub=g('published')||g('updated');
    return{vid:id,title:g('title'),link,chan:ch.title,cid:ch.id,cat:ch.cat,thumb:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ts:pub?new Date(pub).getTime():0}})}

async function resolveChannel(input){input=(input||'').trim();if(!input)return null;
  let id=null,m=input.match(/channel\/(UC[\w-]{20,})/)||input.match(/^(UC[\w-]{20,})$/);if(m)id=m[1];
  let url=id?('https://www.youtube.com/channel/'+id):/^https?:\/\//.test(input)?input:input.startsWith('@')?('https://www.youtube.com/'+input):('https://www.youtube.com/@'+input);
  for(const mk of [u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]){
    try{const r=await timedFetch(mk(url),9000);const t=await r.text();
      if(!id){const mm=t.match(/"(?:channelId|externalId)":"(UC[\w-]+)"/)||t.match(/channel\/(UC[\w-]+)/);if(mm)id=mm[1]}
      let title=null;const tm=t.match(/<meta property="og:title" content="([^"]+)"/)||t.match(/<title>([^<]+?)\s*-\s*YouTube<\/title>/);
      if(tm)title=tm[1].replace(/&amp;/g,'&').replace(/&#0?39;/g,"'").replace(/&#x27;/gi,"'").replace(/&quot;/g,'"');
      if(id)return{id,title:title||input.replace(/^@/,'')}}catch(e){}}
  return id?{id,title:input.replace(/^@/,'')}:null;}
async function resolveVideo(url){const id=vidId(url);if(!id||id.length<6)return null;
  let title='Saved video',author='Saved by me';
  const oe='https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json';
  for(const mk of [u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]){
    try{const r=await timedFetch(mk(oe),9000);const j=JSON.parse(await r.text());if(j&&j.title){title=j.title;author=j.author_name||author;break}}catch(e){}}
  return{vid:id,title,link:'https://www.youtube.com/watch?v='+id,chan:author,cid:'manual',cat:'General',ts:Date.now(),thumb:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`}}

/* ---------- state ---------- */
let S={view:'new',cat:'all',foryou:'rec',q:'',mq:'',pool:LS.get('yf_pool',[]),loading:false,feedError:false,sel:false,selset:new Set(),selctx:'feed',paint:null};
let CURLIST=[];

/* ---------- load pool (fast, progressive) ---------- */
async function loadPool(force){
  if(S.loading)return;S.loading=true;document.getElementById('rIcon').classList.add('spin');
  if(force){CACHE={};saveCache();BEST=-1;}
  const had=S.pool.length>0;
  if(!had)setMain(`<div class="loader"><div style="text-align:center"><div class="dots"><i></i><i></i><i></i></div>
    <div style="margin-top:14px;color:var(--ink-dim);font-size:12.5px" id="ldt">Gathering your channels&hellip;</div></div></div>`);
  const out=[];let done=0,painted=false;const batch=16;
  for(let i=0;i<CH.length;i+=batch){
    const res=await Promise.all(CH.slice(i,i+batch).map(fetchChannel));
    res.forEach(a=>out.push(...a));done+=Math.min(batch,CH.length-i);
    if(out.length&&!painted){out.sort((a,b)=>b.ts-a.ts);S.pool=[...out];painted=true;if(['new','foryou','browse'].includes(S.view))render()}
    const lt=document.getElementById('ldt');if(lt)lt.textContent=`Loading\u2026 ${done}/${CH.length}`;
  }
  out.sort((a,b)=>b.ts-a.ts);S.pool=out;S.loading=false;S.feedError=(out.length===0&&!had);
  document.getElementById('rIcon').classList.remove('spin');
  if(out.length){savePool();
    const firstRun=(SEENRAW===null);const fresh0=out.filter(v=>v.vid&&!SEEN.has(v.vid));
    out.forEach(v=>{if(v.vid)SEEN.add(v.vid)});saveSeen();SEENRAW=[...SEEN];
    let added=0;
    if(!firstRun){const fresh=fresh0.filter(v=>!WATCHED.has(v.vid)&&!INBOX.some(x=>x.vid===v.vid));
      INBOX=[...fresh,...INBOX];if(INBOX.length>400)INBOX=INBOX.slice(0,400);added=fresh.length;saveInbox();}
    toast(firstRun?'Ready \u00b7 new uploads will arrive here':(added?`\u2727 ${added} new`:`Up to date \u00b7 ${out.length}`));
  }else if(!had)toast('Couldn\u2019t reach feeds \u2014 tap \u21bb');
  if(['new','foryou','browse'].includes(S.view))render();
}
async function ensurePool(){if(!S.pool.length)await loadPool()}

/* ---------- recommend (by your watch) ---------- */
function weights(){const m={};S.pool.forEach(v=>{if(WATCHED.has(v.vid))m[v.chan]=(m[v.chan]||0)+1});SAVED.forEach(v=>{m[v.chan]=(m[v.chan]||0)+.6});return m}
function recommend(cat){const w=weights(),has=Object.keys(w).length>0;
  let p=S.pool.filter(v=>!WATCHED.has(v.vid)&&!HIDDEN.has(v.vid));if(cat)p=p.filter(v=>v.cat===cat);
  return p.map(v=>{let s=v.ts/1e10;if(w[v.chan])s+=w[v.chan]*6;return{...v,_s:s}}).sort((a,b)=>b._s-a._s).slice(0,60);}

/* ---------- card ---------- */
function matchQ(v){if(!S.q)return true;const q=S.q.toLowerCase();return (v.title||'').toLowerCase().includes(q)||(v.chan||'').toLowerCase().includes(q)}
function card(v,i,mode){
  const col=catColor(v.cat);
  if(S.sel){const on=S.selset.has(v.vid);
    return `<div class="card pick ${on?'picked':''}" data-pick="${v.vid}" style="--ac:${col};animation-delay:${Math.min(i*12,240)}ms">
      <span class="chk">${on?'\u2713':''}</span>
      <div class="cmain"><div class="crow1"><span class="badge">${esc(v.chan)}</span><span class="time">${timeAgo(v.ts)}</span></div>
        <div class="vtitle">${esc(v.title)}</div></div>
      <div class="cthumb"><img loading="lazy" src="${v.thumb}" onerror="this.src='https://i.ytimg.com/vi/${v.vid}/hqdefault.jpg'"></div></div>`;}
  const saved=SAVED.some(x=>x.vid===v.vid);
  let acts=`<a class="act go" href="${v.link}" target="_blank" rel="noopener" ${mode==='new'?`data-newwatch="${v.vid}"`:''}>\u25b6 Watch</a>`;
  acts+=`<button class="act" data-w="${v.vid}">\u2713 Watched</button>`;
  if(mode==='saved')acts+=`<button class="act warn" data-rm="${v.vid}">\uD83D\uDDD1 Remove</button>`;
  else acts+=`<button class="act ${saved?'on':''}" data-s='${esc(JSON.stringify(v))}'>${saved?'\uD83D\uDCBE Saved':'\uD83D\uDCBE Save'}</button>`;
  return `<div class="card" style="--ac:${col};animation-delay:${Math.min(i*16,320)}ms">
    <div class="cmain"><div class="crow1"><span class="badge">${esc(v.chan)}</span><span class="time">${timeAgo(v.ts)}</span></div>
      <div class="vtitle">${esc(v.title)}</div>
      <div class="vchan">${v.cat}</div>
      <div class="actions">${acts}</div></div>
    <a class="cthumb" href="${v.link}" target="_blank" rel="noopener" ${mode==='new'?`data-newwatch="${v.vid}"`:''}>
      <img loading="lazy" src="${v.thumb}" onerror="this.src='https://i.ytimg.com/vi/${v.vid}/hqdefault.jpg'"><span class="pl">\u25b6</span></a></div>`;
}
function bindCards(scope){const root=scope||document;
  if(S.sel){root.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{const id=el.dataset.pick;
    if(S.selset.has(id))S.selset.delete(id);else S.selset.add(id);
    el.classList.toggle('picked');el.querySelector('.chk').textContent=S.selset.has(id)?'\u2713':'';
    const c=document.getElementById('selCount');if(c)c.textContent=`${S.selset.size} selected`});return;}
  root.querySelectorAll('[data-newwatch]').forEach(a=>a.addEventListener('click',()=>{const id=a.dataset.newwatch;
    INBOX=INBOX.filter(x=>x.vid!==id);saveInbox();setTimeout(()=>{renderNav();if(S.view==='new')render()},500)}));
  root.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const id=b.dataset.w;
    WATCHED.add(id);saveW();INBOX=INBOX.filter(x=>x.vid!==id);saveInbox();SAVED=SAVED.filter(x=>x.vid!==id);saveSaved();
    toast('Marked watched');const c=b.closest('.card');if(c)c.style.opacity=.25;setTimeout(render,260)});
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{SAVED=SAVED.filter(x=>x.vid!==b.dataset.rm);saveSaved();toast('Removed');render()});
  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const v=JSON.parse(b.dataset.s.replace(/&#39;/g,"'"));
    if(SAVED.some(x=>x.vid===v.vid)){SAVED=SAVED.filter(x=>x.vid!==v.vid);toast('Removed from Saved')}else{SAVED.push(v);toast('\uD83D\uDCBE Saved')}
    saveSaved();b.textContent=SAVED.some(x=>x.vid===v.vid)?'\uD83D\uDCBE Saved':'\uD83D\uDCBE Save';b.classList.toggle('on');renderNav()});
}

/* ---------- top bar (clear + select) ---------- */
function topActions(clearLabel,ctx){
  if(S.sel){const del=ctx==='saved'?'Remove':'Delete';
    return `<div class="selbar"><button class="act" id="selAll">All</button>
      <span class="selcount" id="selCount">${S.selset.size} selected</span>
      <button class="act go" id="selWatch">\u2713 Watched</button>
      <button class="act" id="selSave">\uD83D\uDCBE Save</button>
      <button class="act warn" id="selDel">\uD83D\uDDD1 ${del}</button>
      <button class="act" id="selCancel">Cancel</button></div>`;}
  return `<div class="topbar">${clearLabel!==null?`<button class="act" id="clearAll">\uD83D\uDDD1 ${clearLabel||'Clear'}</button>`:''}
    <button class="act" id="selBtn">\u2611 Select</button></div>`;
}
function bindTop(onClear,ctx){
  if(S.sel){
    document.getElementById('selAll').onclick=()=>{const all=S.selset.size>=CURLIST.length;S.selset=all?new Set():new Set(CURLIST.map(v=>v.vid));render()};
    document.getElementById('selCancel').onclick=()=>{S.sel=false;S.selset=new Set();render()};
    document.getElementById('selWatch').onclick=()=>{if(!S.selset.size)return toast('Select some first');
      S.selset.forEach(id=>{WATCHED.add(id);INBOX=INBOX.filter(x=>x.vid!==id);SAVED=SAVED.filter(x=>x.vid!==id)});
      saveW();saveInbox();saveSaved();toast(`${S.selset.size} watched`);S.sel=false;S.selset=new Set();render()};
    document.getElementById('selSave').onclick=()=>{if(!S.selset.size)return toast('Select some first');let n=0;
      CURLIST.forEach(v=>{if(S.selset.has(v.vid)&&!SAVED.some(x=>x.vid===v.vid)){SAVED.push(v);n++}});saveSaved();
      toast(`${n} saved`);S.sel=false;S.selset=new Set();render()};
    document.getElementById('selDel').onclick=()=>{if(!S.selset.size)return toast('Select some first');const ids=S.selset;
      if(ctx==='inbox')INBOX=INBOX.filter(x=>!ids.has(x.vid)),saveInbox();
      else if(ctx==='saved')SAVED=SAVED.filter(x=>!ids.has(x.vid)),saveSaved();
      else{ids.forEach(id=>HIDDEN.add(id));saveHidden()}
      toast(`${ids.size} removed`);S.sel=false;S.selset=new Set();render()};
  }else{const cb=document.getElementById('clearAll');if(cb&&onClear)cb.onclick=onClear;
    const sb=document.getElementById('selBtn');if(sb)sb.onclick=()=>{S.sel=true;S.selset=new Set();S.selctx=ctx;render()};}
}

/* ---------- nav ---------- */
const NAV=[{k:'new',ic:'\uD83D\uDCF0',label:'New'},{k:'foryou',ic:'\u2728',label:'For You'},
  {k:'browse',ic:'\uD83D\uDDC2\uFE0F',label:'Browse'},{k:'manage',ic:'\u2699\uFE0F',label:'Subs'}];
function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(n=>{const badge=(n.k==='new'&&INBOX.length)?`<span class="badge2">${INBOX.length>99?'99+':INBOX.length}</span>`:'';
    return `<button data-v="${n.k}" class="${S.view===n.k?'on':''}"><span class="ic">${n.ic}</span><span class="lbl">${n.label}</span>${badge}</button>`}).join('');
  document.getElementById('nav').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.q='';S.mq='';S.sel=false;S.selset=new Set();render()});
}
function updateSub(){document.getElementById('sub').textContent=`${CH.length} channels \u00b7 one feed`}

/* ---------- ui helpers ---------- */
function showChips(items,active,pick){const el=document.getElementById('chips');el.style.display='flex';
  el.innerHTML=items.map(c=>`<button class="chip ${active===c.k?'on':''}" data-k="${c.k}">${c.label}${c.n!=null?` \u00b7 ${c.n}`:''}</button>`).join('');
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.sel=false;S.selset=new Set();pick(b.dataset.k)})}
function hideChips(){document.getElementById('chips').style.display='none'}
function showSearch(ph){const t=document.getElementById('toolbar');t.style.display='block';
  t.innerHTML=`<div class="search"><span class="si">\uD83D\uDD0D</span><input id="qIn" placeholder="${ph||'Search\u2026'}" value="${esc(S.q)}"></div>`;
  const i=document.getElementById('qIn');i.oninput=()=>{S.q=i.value;if(S.paint)S.paint()};}
function hideSearch(){const t=document.getElementById('toolbar');t.style.display='none';t.innerHTML=''}
function statusLine(n){return `<div class="status"><span class="pill">${n} videos</span><span class="pill">${INBOX.length} new</span><span class="pill">${SAVED.length} saved</span></div>`}
function listHTML(list,mode){return list.map((v,i)=>card(v,i,mode)).join('')}
function emptyHTML(ic,t,sub){return `<div class="empty"><div class="big">${ic}</div><b>${t}</b><br>${sub}</div>`}

async function render(){
  renderNav();updateSub();
  const v=S.view;
  if(['new','foryou','browse'].includes(v))await ensurePool();
  if(v==='new')return viewNew();
  if(v==='foryou')return viewForYou();
  if(v==='browse')return viewBrowse();
  if(v==='manage')return viewManage();
}

/* ---- New ---- */
function viewNew(){
  hideChips();showSearch('Search new\u2026');
  document.getElementById('main').innerHTML=`<div id="list"></div>`;
  S.paint=paintNew;paintNew();
}
function paintNew(){
  INBOX=INBOX.filter(v=>!WATCHED.has(v.vid));saveInbox();
  const list=INBOX.filter(matchQ);CURLIST=list;
  const box=document.getElementById('list');if(!box)return;
  if(!INBOX.length){box.innerHTML=S.feedError
    ?emptyHTML('\uD83D\uDCE1','Couldn\u2019t reach feeds','The free servers can be busy.<br><button class="btn" id="retry" style="margin-top:14px">\u21bb Retry</button>')
    :emptyHTML('\uD83D\uDCEC','No new drops yet','New uploads arrive here automatically and leave once you watch them.');
    const r=document.getElementById('retry');if(r)r.onclick=async()=>{S.pool=[];await loadPool(true);render()};return;}
  box.innerHTML=topActions('Clear all','inbox')+statusLine(list.length)+(list.length?listHTML(list,'new'):emptyHTML('\uD83D\uDD0E','No matches','Try a different word.'));
  bindCards(box);bindTop(()=>{INBOX=[];saveInbox();toast('Cleared');render()},'inbox');
}

/* ---- For You ---- */
const FORYOU=[{k:'rec',label:'For You'},{k:'AI',label:'AI'},{k:'HR',label:'HR'}];
function viewForYou(){
  if(!['rec','AI','HR'].includes(S.foryou))S.foryou='rec';

  S.paint=paintForYou;paintForYou();
}
function paintForYou(){
  const list=recommend(S.foryou==='rec'?null:S.foryou).filter(matchQ);CURLIST=list;
  const box=document.getElementById('list');if(!box)return;
  const hint=Object.keys(weights()).length?'':`<div class="status"><span class="pill">Watch a few videos to personalise this</span></div>`;
  box.innerHTML=(list.length?topActions('Clear these','feed'):'')+hint+(list.length?listHTML(list,'feed'):emptyHTML('\uD83C\uDF31',S.loading?'Loading\u2026':'Nothing yet','Watch videos and this fills up by your taste.'));
  bindCards(box);if(list.length)bindTop(()=>{if(confirm('Hide these picks? (marks watched)')){list.forEach(v=>WATCHED.add(v.vid));saveW();toast('Cleared');render()}},'feed');
}

/* ---- Browse ---- */
function viewBrowse(){
  const cats=allCats();
  const chips=[{k:'all',label:'All New'},...cats.map(c=>({k:c,label:c})),{k:'saved',label:'\uD83D\uDCBE Saved',n:SAVED.length}];
  if(!chips.some(c=>c.k===S.cat))S.cat='all';
  showChips(chips,S.cat,k=>{S.cat=k;render()});showSearch('Search\u2026');
  document.getElementById('main').innerHTML=`<div id="list"></div>`;
  S.paint=paintBrowse;paintBrowse();
}
function paintBrowse(){
  const box=document.getElementById('list');if(!box)return;
  if(S.cat==='saved'){
    const addbox=S.sel?'':`<div class="box"><h3>\uD83D\uDCBE Save any video</h3>
      <div class="row"><input class="inp" id="vIn" placeholder="Paste a YouTube link"><button class="btn" id="vAdd">Save</button></div>
      <div class="note" id="vNote">Anything you Save from a card also lands here.</div></div>`;
    const list=SAVED.slice().reverse().filter(matchQ);CURLIST=list;
    box.innerHTML=addbox+(SAVED.length?topActions('Clear all','saved'):'')+(list.length?listHTML(list,'saved'):emptyHTML('\uD83D\uDCBE','Nothing saved yet','Tap \uD83D\uDCBE Save on any video, or paste a link above.'));
    bindCards(box);if(SAVED.length)bindTop(()=>{if(confirm('Remove all saved videos?')){SAVED=[];saveSaved();toast('Cleared');render()}},'saved');
    if(!S.sel){const vIn=document.getElementById('vIn'),vAdd=document.getElementById('vAdd'),vNote=document.getElementById('vNote');
      vAdd.onclick=async()=>{const u=vIn.value.trim();if(!u){vNote.textContent='Paste a link first.';return}
        vAdd.disabled=true;vAdd.textContent='\u2026';const v=await resolveVideo(u);
        if(!v){vAdd.disabled=false;vAdd.textContent='Save';vNote.textContent='That doesn\u2019t look like a YouTube link.';return}
        if(SAVED.some(x=>x.vid===v.vid)){vAdd.disabled=false;vAdd.textContent='Save';vNote.textContent='Already saved.';return}
        SAVED.push(v);saveSaved();vIn.value='';vAdd.disabled=false;vAdd.textContent='Save';toast('\uD83D\uDCBE Saved');render()};
      vIn.addEventListener('keydown',e=>{if(e.key==='Enter')vAdd.click()})}
    return;
  }
  let list=S.pool.filter(v=>!WATCHED.has(v.vid)&&!HIDDEN.has(v.vid));
  if(S.cat!=='all')list=list.filter(v=>v.cat===S.cat);
  list=list.filter(matchQ).slice(0,100);CURLIST=list;
  box.innerHTML=(list.length?topActions('Mark all watched','feed'):'')+(list.length?listHTML(list,'feed'):emptyHTML('\uD83C\uDF43',S.loading?'Loading\u2026':'Nothing here','Tap \u21bb, assign channels in Subs, or change category.'));
  bindCards(box);if(list.length)bindTop(()=>{if(confirm('Mark all shown as watched?')){list.forEach(v=>WATCHED.add(v.vid));saveW();toast('Done');render()}},'feed');
}

/* ---- Subs ---- */
function viewManage(){
  hideChips();hideSearch();
  const main=document.getElementById('main');
  main.innerHTML=`
    <div class="box"><h3>\uD83D\uDCC2 Add a channel</h3>
      <div class="row"><input class="inp" id="addIn" placeholder="Channel link, @handle or ID"></div>
      <div class="row"><select class="sel" id="addCat"></select><button class="btn" id="addBtn" style="flex:1">Add</button></div>
      <div class="note" id="addNote">Paste a link with \u201c/channel/UC\u2026\u201d or the UC\u2026 ID. @handles work too.</div></div>
    <div class="box"><h3>\uD83C\uDFF7\uFE0F Create a category</h3>
      <div class="row"><input class="inp" id="catIn" placeholder="e.g. Finance, Health\u2026"><button class="btn" id="catBtn">Create</button></div>
      <div class="note">Then assign channels to it below or when adding.</div></div>
    <div class="row"><input class="inp" id="mIn" placeholder="Filter channels\u2026" value="${esc(S.mq)}"></div>
    <div id="mlist"></div>`;
  fillCatSelect();
  document.getElementById('mIn').oninput=e=>{S.mq=e.target.value;paintManage()};
  paintManage();
  document.getElementById('catBtn').onclick=()=>{const n=document.getElementById('catIn').value.trim();
    if(!n)return;if(allCats().some(c=>c.toLowerCase()===n.toLowerCase()))return toast('Category exists');
    CUSTOMCATS.push(n);saveCats();document.getElementById('catIn').value='';fillCatSelect();toast('Category created');paintManage()};
  const addBtn=document.getElementById('addBtn'),addIn=document.getElementById('addIn'),addCat=document.getElementById('addCat'),note=document.getElementById('addNote');
  addBtn.onclick=async()=>{const val=addIn.value.trim();if(!val){note.textContent='Paste a channel link, @handle or ID.';return}
    addBtn.disabled=true;addBtn.textContent='\u2026';note.textContent='Looking up\u2026';const res=await resolveChannel(val);
    if(!res){addBtn.disabled=false;addBtn.textContent='Add';note.textContent='Couldn\u2019t find it. Paste the \u201c/channel/UC\u2026\u201d link or the UC\u2026 ID.';return}
    if(CH.some(c=>c.id===res.id)){addBtn.disabled=false;addBtn.textContent='Add';note.textContent='Already in your list.';return}
    REMOVED.delete(res.id);saveRemoved();CATMAP[res.id]=addCat.value;saveCatmap();
    ADDED.push({id:res.id,title:res.title,cat:addCat.value});saveAdded();rebuildCH();delete CACHE[res.id];saveCache();
    addIn.value='';addBtn.disabled=false;addBtn.textContent='Add';note.textContent=`Added \u201c${res.title}\u201d to ${addCat.value}. Tap \u21bb to load.`;
    toast('Channel added');updateSub();paintManage();renderNav()};
  addIn.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click()});
}
function fillCatSelect(){const s=document.getElementById('addCat');if(s)s.innerHTML=allCats().map(c=>`<option>${esc(c)}</option>`).join('')}
function paintManage(){
  const box=document.getElementById('mlist');if(!box)return;const q=S.mq.trim().toLowerCase();
  let html=`<div class="status"><span class="pill">${CH.length} channels</span><span class="pill">${allCats().length} categories</span></div>`;
  allCats().forEach(cat=>{let rows=CH.filter(c=>c.cat===cat&&(!q||c.title.toLowerCase().includes(q)));
    if(!rows.length)return;rows.sort((a,b)=>a.title.localeCompare(b.title));
    html+=`<div class="glabel"><span class="d" style="background:${catColor(cat)}"></span>${esc(cat)} \u00b7 ${rows.length}</div>`;
    html+=rows.map(c=>`<div class="crow"><span class="dot" style="background:${catColor(c.cat)}"></span>
      <div style="min-width:0"><b>${esc(c.title)}</b></div>
      <select class="csel" data-recat="${c.id}">${allCats().map(x=>`<option ${x===c.cat?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <button class="x" data-del="${c.id}">\u00d7</button></div>`).join('');
  });
  const reset=(REMOVED.size||ADDED.length||CUSTOMCATS.length||Object.keys(CATMAP).length)
    ?`<button class="act warn" id="resetAll" style="margin-top:10px">\u21bb Reset all changes</button>`:'';
  box.innerHTML=html+reset;
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;
    if(ADDED.some(a=>a.id===id)){ADDED=ADDED.filter(a=>a.id!==id);saveAdded()}else{REMOVED.add(id);saveRemoved()}
    delete CATMAP[id];saveCatmap();rebuildCH();S.pool=S.pool.filter(v=>v.cid!==id);savePool();
    toast('Removed');updateSub();paintManage();renderNav()});
  box.querySelectorAll('[data-recat]').forEach(s=>s.onchange=()=>{CATMAP[s.dataset.recat]=s.value;saveCatmap();
    rebuildCH();syncCats();toast('Category updated');paintManage()});
  const rb=document.getElementById('resetAll');if(rb)rb.onclick=()=>{if(confirm('Restore original channels & categories?')){
    REMOVED=new Set();ADDED=[];CATMAP={};CUSTOMCATS=[];saveRemoved();saveAdded();saveCatmap();saveCats();
    rebuildCH();S.pool=[];toast('Reset');updateSub();fillCatSelect();render()}};
}

/* ---------- utils ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function timeAgo(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;
  if(s<3600)return Math.max(1,Math.floor(s/60))+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<86400*7)return Math.floor(s/86400)+'d ago';if(s<86400*30)return Math.floor(s/86400/7)+'w ago';return Math.floor(s/86400/30)+'mo ago'}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1700)}
function setMain(h){document.getElementById('main').innerHTML=h}

/* ---------- init ---------- */
document.getElementById('refreshBtn').onclick=async()=>{S.pool=[];await loadPool(true);render()};
render();
if(S.pool.length)loadPool();
let lastCheck=Date.now();
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&Date.now()-lastCheck>5*60*1000){
  lastCheck=Date.now();if(['new','foryou','browse'].includes(S.view))await loadPool()}});
</script>
</body></html>
