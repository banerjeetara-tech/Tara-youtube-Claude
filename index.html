<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>My Feed</title>
<style>
:root{
  --bg:#f1ede4; --paper:#f7f4ed; --card:#fffdf8; --card2:#fbf7ee;
  --ink:#37352f; --ink-dim:#8a8275; --line:#e6dfd2;
  --brand:#6f9e8a; --brand-d:#5b8a76;
  --ai:#9a7aa6; --hr:#c67e84; --pod:#c39a4e; --news:#8a9a5b; --gen:#6fa08c; --watch:#c2745a;
  --shadow:0 10px 28px rgba(90,80,60,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 90% -10%, rgba(154,122,166,.08), transparent 60%),
    radial-gradient(900px 480px at -10% 4%, rgba(111,158,138,.10), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  min-height:100vh;
}

/* header */
header{
  position:sticky;top:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background:linear-gradient(180deg, rgba(241,237,228,.97), rgba(241,237,228,.7) 75%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:11px;
}
.logo{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--brand),var(--gen));
  display:grid;place-items:center;font-size:16px;color:#fff;box-shadow:var(--shadow)}
.htxt h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
.htxt p{margin:1px 0 0;font-size:11px;color:var(--ink-dim)}
.refresh{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:11px;padding:8px 12px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(90,80,60,.07)}
.refresh:active{transform:scale(.95)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* view title */
.vhead{padding:14px 18px 4px;max-width:820px;margin:0 auto}
.vhead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.vhead p{margin:3px 0 0;font-size:12.5px;color:var(--ink-dim);line-height:1.45}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;max-width:820px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip .d{width:7px;height:7px;border-radius:50%}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip.on .d{background:#fff!important}
.chip .n{font-size:11px;opacity:.7;font-weight:800}

/* search / inputs */
.toolbar{padding:6px 16px 2px;max-width:820px;margin:0 auto}
.input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:15px;outline:none;box-shadow:0 2px 8px rgba(90,80,60,.05)}
.input::placeholder{color:var(--ink-dim)}

main{padding:8px 16px 96px;max-width:820px;margin:0 auto}

/* status line */
.status{font-size:12px;color:var(--ink-dim);padding:4px 2px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px}

/* card */
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:9px;margin-bottom:10px;box-shadow:0 4px 12px rgba(90,80,60,.06);position:relative;overflow:hidden;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.thumb{position:relative;flex:none;width:124px;height:70px;border-radius:10px;overflow:hidden;background:#e7e0d3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(0,0,0,.04),rgba(0,0,0,.3));font-size:22px;color:#fff;opacity:.92}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.vtitle{font-size:13.5px;font-weight:700;line-height:1.3;margin:0 0 4px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vchan{font-size:11.5px;color:var(--ink-dim);font-weight:600;display:flex;align-items:center;gap:6px}
.tagdot{width:7px;height:7px;border-radius:50%;flex:none}
.vtime{font-size:11px;color:var(--ink-dim);margin-top:auto;opacity:.85}
.actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.act{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:9px;padding:6px 10px;font-size:11.5px;font-weight:700;display:flex;gap:4px;align-items:center}
.act:active{transform:scale(.93)}
.act.go{background:var(--brand);color:#fff;border:none}
.act.warn{color:var(--watch)}

/* manage list rows */
.crow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;margin-bottom:8px}
.crow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.crow b{font-size:13.5px;font-weight:700;display:block;line-height:1.25}
.crow small{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.crow .x{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--watch);
  border-radius:9px;width:34px;height:34px;font-size:16px;font-weight:800;flex:none}
.crow .x:active{transform:scale(.9)}
.addbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:14px;box-shadow:0 4px 12px rgba(90,80,60,.06)}
.addbox .row{display:flex;gap:8px;margin-top:9px}
.sel{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:0 10px;font-size:13px;font-weight:700}
.btn{border:none;background:var(--brand);color:#fff;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:800;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.55}
.note{font-size:11.5px;color:var(--ink-dim);line-height:1.5;margin-top:9px}

/* group label */
.glabel{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);
  margin:16px 2px 8px;display:flex;align-items:center;gap:7px}
.glabel .d{width:8px;height:8px;border-radius:50%}

/* empty / loader */
.empty{text-align:center;color:var(--ink-dim);padding:46px 20px;font-size:13.5px;line-height:1.6}
.empty .big{font-size:38px;margin-bottom:10px}
.loader{display:grid;place-items:center;padding:42px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--brand);animation:bb 1s infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--gen)}.dots i:nth-child(3){animation-delay:.3s;background:var(--pod)}
@keyframes bb{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
  background:linear-gradient(0deg, var(--paper), rgba(247,244,237,.92));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:none;color:var(--ink-dim);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:4px 0;position:relative}
.nav .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--brand)}
.nav .badge{position:absolute;top:-2px;right:50%;transform:translateX(16px);background:var(--watch);color:#fff;
  font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow);max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),12000);
  try{return await fetch(u,{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(to)}
}
async function fetchChannel(ch){
  const c=CACHE[ch.id];
  if(c&&(Date.now()-c.t<30*60*1000))return c.items;
  for(const mk of PROXIES){
    try{
      const r=await timedFetch(mk(ch.id));if(!r.ok)continue;
      const ct=r.headers.get('content-type')||'';let items=[];
      if(ct.includes('json')){
        const j=await r.json();
        if(j.items)items=j.items.map(it=>mkEntry({title:it.title,link:it.link,pub:it.pubDate,
          id:(it.guid||it.link||'').split(':').pop(),thumb:it.thumbnail||(it.enclosure&&it.enclosure.link)||''},ch));
        else continue;
      }else{items=parseXML(await r.text(),ch);}
      if(items.length){CACHE[ch.id]={t:Date.now(),items};saveCache();return items;}
    }catch(e){}
  }
  return c?c.items:[];
}
function vidId(link){const m=(link||'').match(/[?&]v=([^&]+)/)||(link||'').match(/watch\?v=([\w-]+)/);return m?m[1]:(link||'').split('/').pop()}
function mkEntry(e,ch){const id=vidId(e.link)||e.id;return{vid:id,title:e.title||'(untitled)',
  link:e.link||('https://youtu.be/'+id),chan:ch.title,cat:ch.cat,
  thumb:e.thumb||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ts:e.pub?new Date(e.pub).getTime():0}}
function parseXML(xml,ch){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.getElementsByTagName('entry')].map(en=>{
    const g=t=>{const el=en.getElementsByTagName(t)[0];return el?el.textContent:''};
    const id=(en.getElementsByTagName('yt:videoId')[0]||{}).textContent
      ||vidId((en.getElementsByTagName('link')[0]||{}).getAttribute?.('href'));
    const link=(en.getElementsByTagName('link')[0]||{}).getAttribute?.('href')||('https://youtu.be/'+id);
    const pub=g('published')||g('updated');
    return{vid:id,title:g('title'),link,chan:ch.title,cat:ch.cat,
      thumb:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ts:pub?new Date(pub).getTime():0};
  });
}

/* ---------- resolve a channel for "Add" ---------- */
async function resolveChannel(input){
  input=(input||'').trim();if(!input)return null;
  let id=null,m=input.match(/channel\/(UC[\w-]{20,})/)||input.match(/^(UC[\w-]{20,})$/);
  if(m)id=m[1];
  let url= id?('https://www.youtube.com/channel/'+id)
    : /^https?:\/\//.test(input)?input
    : input.startsWith('@')?('https://www.youtube.com/'+input):('https://www.youtube.com/@'+input);
  for(const mk of [u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
                   u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]){
    try{
      const r=await timedFetch(mk(url));const t=await r.text();
      if(!id){const mm=t.match(/"(?:channelId|externalId)":"(UC[\w-]+)"/)||t.match(/channel\/(UC[\w-]+)/);if(mm)id=mm[1];}
      let title=null;const tm=t.match(/<meta property="og:title" content="([^"]+)"/)||t.match(/<title>([^<]+?)\s*-\s*YouTube<\/title>/);
      if(tm)title=tm[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&#x27;/g,"'");
      if(id)return{id,title:title||input.replace(/^@/,'')};
    }catch(e){}
  }
  return id?{id,title:input.replace(/^@/,'')}:null;
}

/* ---------- state ---------- */
let S={view:'new',cat:'all',foryou:'rec',q:'',mq:'',pool:[],loading:false,feedError:false};

/* ---------- load pool ---------- */
async function loadPool(force){
  if(S.loading)return;S.loading=true;document.getElementById('rIcon').classList.add('spin');
  if(force){CACHE={};saveCache();}
  setMain(`<div class="loader"><div style="text-align:center"><div class="dots"><i></i><i></i><i></i></div>
    <div style="margin-top:13px;color:var(--ink-dim);font-size:12.5px" id="ldt">Checking your subscriptions for new drops&hellip;</div></div></div>`);
  const out=[];let done=0;const batch=6;
  for(let i=0;i<CH.length;i+=batch){
    const res=await Promise.all(CH.slice(i,i+batch).map(fetchChannel));
    res.forEach(a=>out.push(...a));done+=Math.min(batch,CH.length-i);
    const lt=document.getElementById('ldt');if(lt)lt.textContent=`Fetching\u2026 ${done}/${CH.length} channels`;
  }
  out.sort((a,b)=>b.ts-a.ts);
  S.pool=out;S.loading=false;S.feedError=(out.length===0);
  document.getElementById('rIcon').classList.remove('spin');
  if(out.length){
    const firstRun=(SEENRAW===null);
    const fresh0=out.filter(v=>v.vid&&!SEEN.has(v.vid));
    out.forEach(v=>{if(v.vid)SEEN.add(v.vid)});saveSeen();SEENRAW=[...SEEN];
    let added=0;
    if(!firstRun){
      const fresh=fresh0.filter(v=>!WATCHED.has(v.vid)&&!INBOX.some(x=>x.vid===v.vid));
      INBOX=[...fresh,...INBOX];if(INBOX.length>400)INBOX=INBOX.slice(0,400);added=fresh.length;saveInbox();
    }
    toast(firstRun?'Baseline set \u00b7 new uploads auto-save to New':(added?`\u26a1 ${added} new added to New`:`Up to date \u00b7 ${out.length} videos`));
  }else{toast('Couldn\u2019t reach feeds \u2014 tap Retry');}
}
async function ensurePool(){if(!S.pool.length)await loadPool();}

/* ---------- recommendations ---------- */
function weights(){const m={};S.pool.forEach(v=>{if(WATCHED.has(v.vid))m[v.chan]=(m[v.chan]||0)+1});
  TOWATCH.forEach(v=>{m[v.chan]=(m[v.chan]||0)+.5});return m}
function recommend(cat){
  const w=weights(),has=Object.keys(w).length>0;
  let p=S.pool.filter(v=>!WATCHED.has(v.vid));if(cat)p=p.filter(v=>v.cat===cat);
  return p.map(v=>{let s=v.ts/1e10;if(w[v.chan])s+=w[v.chan]*5;if(!has&&(v.cat==='AI'||v.cat==='HR'))s+=2;return{...v,_s:s}})
    .sort((a,b)=>b._s-a._s).slice(0,60);
}

/* ---------- card ---------- */
function card(v,i,mode){
  const col=catColor(v.cat);const saved=TOWATCH.some(x=>x.vid===v.vid);
  let acts=`<a class="act go" href="${v.link}" target="_blank" rel="noopener">\u25b6 Watch</a>`;
  if(mode==='watched'){acts+=`<button class="act" data-uw="${v.vid}">\u21ba Unwatch</button>`;}
  else if(mode==='saved'){acts+=`<button class="act done" data-w="${v.vid}">\u2713 Watched</button><button class="act warn" data-rm="${v.vid}">\u2212 Remove</button>`;}
  else{acts+=`<button class="act" data-w="${v.vid}">\u2713 Watched</button><button class="act" data-s='${esc(JSON.stringify(v))}'>${saved?'\u2713 Saved':'\uff0b Later'}</button>`;}
  return `<div class="card" style="animation-delay:${Math.min(i*20,360)}ms">
    <div class="accent" style="background:${col}"></div>
    <a class="thumb" href="${v.link}" target="_blank" rel="noopener">
      <img loading="lazy" src="${v.thumb}" onerror="this.src='https://i.ytimg.com/vi/${v.vid}/hqdefault.jpg'"><span class="pl">\u25b6</span></a>
    <div class="meta"><div class="vtitle">${esc(v.title)}</div>
      <div class="vchan"><span class="tagdot" style="background:${col}"></span>${esc(v.chan)} \u00b7 ${v.cat}</div>
      <div class="vtime">${timeAgo(v.ts)}</div><div class="actions">${acts}</div></div></div>`;
}
function bindCards(scope){
  const root=scope||document;
  root.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const id=b.dataset.w;
    WATCHED.add(id);saveW();INBOX=INBOX.filter(x=>x.vid!==id);saveInbox();
    TOWATCH=TOWATCH.filter(x=>x.vid!==id);saveT();
    toast('Marked watched');b.closest('.card').style.opacity=.25;setTimeout(render,300);});
  root.querySelectorAll('[data-uw]').forEach(b=>b.onclick=()=>{WATCHED.delete(b.dataset.uw);saveW();toast('Moved back');render();});
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{TOWATCH=TOWATCH.filter(x=>x.vid!==b.dataset.rm);saveT();toast('Removed');render();});
  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const v=JSON.parse(b.dataset.s.replace(/&#39;/g,"'"));
    if(TOWATCH.some(x=>x.vid===v.vid)){TOWATCH=TOWATCH.filter(x=>x.vid!==v.vid);toast('Removed from saved');}
    else{TOWATCH.push(v);toast('Saved to watch later');}saveT();b.textContent=TOWATCH.some(x=>x.vid===v.vid)?'\u2713 Saved':'\uff0b Later';});
}

/* ---------- list helpers ---------- */
function statusLine(n){return `<div class="status"><span class="pill">${n} videos</span>
  <span class="pill">${INBOX.length} new</span><span class="pill">${TOWATCH.length} saved</span><span class="pill">${WATCHED.size} watched</span></div>`}
function listHTML(list,mode,emptyIcon,emptyTitle,emptySub){
  if(!list.length)return `<div class="empty"><div class="big">${emptyIcon}</div><b>${emptyTitle}</b><br>${emptySub}</div>`;
  return statusLine(list.length)+list.map((v,i)=>card(v,i,mode)).join('');
}

/* =======================================================
   VIEWS
   ======================================================= */
const NAV=[
  {k:'new',ic:'\uD83C\uDD95',label:'New'},
  {k:'foryou',ic:'\u2728',label:'For You'},
  {k:'search',ic:'\uD83D\uDD0D',label:'Search'},
  {k:'browse',ic:'\uD83D\uDDC2\uFE0F',label:'Browse'},
  {k:'manage',ic:'\u2699\uFE0F',label:'Subs'},
];
function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(n=>{
    const badge=(n.k==='new'&&INBOX.length)?`<span class="badge">${INBOX.length>99?'99+':INBOX.length}</span>`:'';
    return `<button data-v="${n.k}" class="${S.view===n.k?'on':''}"><span class="ic">${n.ic}</span>${n.label}${badge}</button>`;
  }).join('');
  document.getElementById('nav').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.q='';S.mq='';render();});
}

const BROWSE=[
  {k:'all',label:'All New',d:'var(--brand)'},
  {k:'AI',label:'AI',d:'var(--ai)'},{k:'HR',label:'HR',d:'var(--hr)'},
  {k:'Podcast',label:'Podcasts',d:'var(--pod)'},{k:'News',label:'News',d:'var(--news)'},
  {k:'General',label:'General',d:'var(--gen)'},
  {k:'towatch',label:'To Watch',d:'var(--watch)'},{k:'watched',label:'Watched',d:'#9a9384'},
];
const FORYOU=[{k:'rec',label:'\u2728 For You',d:'var(--brand)'},{k:'AI',label:'\u2726 AI Picks',d:'var(--ai)'},{k:'HR',label:'\u25C8 HR Picks',d:'var(--hr)'}];

function setHead(title,sub){document.getElementById('vhead').innerHTML=`<h2>${title}</h2>${sub?`<p>${sub}</p>`:''}`}
function showChips(items,active,onPick){
  const el=document.getElementById('chips');el.style.display='flex';
  el.innerHTML=items.map(c=>`<button class="chip ${active===c.k?'on':''}" data-k="${c.k}">
    ${c.d?`<span class="d" style="background:${c.d}"></span>`:''}${c.label}${c.n!=null?`<span class="n">${c.n}</span>`:''}</button>`).join('');
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>onPick(b.dataset.k));
}
function hideChips(){document.getElementById('chips').style.display='none'}
function showToolbar(html){const t=document.getElementById('toolbar');t.style.display='block';t.innerHTML=html}
function hideToolbar(){const t=document.getElementById('toolbar');t.style.display='none';t.innerHTML=''}

async function render(){
  renderNav();
  const v=S.view;
  // views that need the pool
  if(['new','foryou','search','browse'].includes(v)) await ensurePool();

  if(v==='new')      return viewNew();
  if(v==='foryou')   return viewForYou();
  if(v==='search')   return viewSearch();
  if(v==='browse')   return viewBrowse();
  if(v==='manage')   return viewManage();
}

/* ---- New (auto inbox) ---- */
function viewNew(){
  hideChips();hideToolbar();
  INBOX=INBOX.filter(v=>!WATCHED.has(v.vid));saveInbox();
  setHead('\uD83C\uDD95 New Drops','New videos & podcasts from your subscriptions land here automatically. They stay until you mark them Watched.');
  const m=document.getElementById('main');
  if(!INBOX.length){
    m.innerHTML=S.feedError
      ?`<div class="empty"><div class="big">\uD83D\uDCE1</div><b>Couldn\u2019t reach your feeds</b><br>The free feed servers can be busy.<br><button class="act go" id="retry" style="margin-top:14px">\u21bb Retry now</button></div>`
      :`<div class="empty"><div class="big">\uD83D\uDD14</div><b>No new drops yet</b><br>When your channels post something new, it auto-collects here on Refresh.</div>`;
  }else{
    m.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="act warn" id="clr">\uD83D\uDDD1 Clear all</button></div>`+statusLine(INBOX.length)+INBOX.map((v,i)=>card(v,i,'feed')).join('');
    bindCards();
  }
  const r=document.getElementById('retry');if(r)r.onclick=async()=>{S.pool=[];await loadPool(true);render();};
  const c=document.getElementById('clr');if(c)c.onclick=()=>{INBOX=[];saveInbox();toast('Cleared');render();};
}

/* ---- For You ---- */
function viewForYou(){
  hideToolbar();
  if(!['rec','AI','HR'].includes(S.foryou))S.foryou='rec';
  showChips(FORYOU,S.foryou,k=>{S.foryou=k;render();});
  const sub=S.foryou==='rec'?'Recommended from your subscriptions, ranked by the channels you actually watch.'
    :S.foryou==='AI'?'AI videos ranked by your viewing habits.':'HR videos ranked by your viewing habits.';
  setHead('\u2728 For You',sub);
  const list=recommend(S.foryou==='rec'?null:S.foryou);
  document.getElementById('main').innerHTML=listHTML(list,'feed','\uD83C\uDF31','Nothing to recommend yet','Mark a few videos as Watched so I can learn your taste.');
  bindCards();
}

/* ---- Search ---- */
function viewSearch(){
  hideChips();
  setHead('\uD83D\uDD0D Search','Search across the latest videos from all your subscriptions.');
  showToolbar(`<input class="input" id="sIn" placeholder="Search videos & channels\u2026" value="${esc(S.q)}">`);
  const inp=document.getElementById('sIn');
  inp.oninput=()=>{S.q=inp.value;paintSearch();};
  // results container
  document.getElementById('main').innerHTML=`<div id="sres"></div>`;
  paintSearch();
  inp.focus();
}
function paintSearch(){
  const q=S.q.trim().toLowerCase();const box=document.getElementById('sres');if(!box)return;
  if(!q){box.innerHTML=`<div class="empty"><div class="big">\uD83D\uDD0E</div><b>Type to search</b><br>Find any recent video by title or channel name.</div>`;return;}
  const chans=[...new Set(S.pool.map(v=>v.chan))].filter(c=>c.toLowerCase().includes(q)).slice(0,12);
  const vids=S.pool.filter(v=>v.title.toLowerCase().includes(q)||v.chan.toLowerCase().includes(q)).slice(0,80);
  let html='';
  if(chans.length){
    html+=`<div class="glabel">Channels</div><div class="chips" style="padding-left:0;padding-right:0">`+
      chans.map(c=>{const ch=CH.find(x=>x.title===c);const col=ch?catColor(ch.cat):'var(--brand)';
        return `<a class="chip" style="text-decoration:none" href="https://www.youtube.com/channel/${ch?ch.id:''}/videos" target="_blank" rel="noopener"><span class="d" style="background:${col}"></span>${esc(c)}</a>`}).join('')+`</div>`;
  }
  html+=`<div class="glabel">Videos</div>`+listHTML(vids,'feed','\uD83C\uDF43','No matches','Try a different word.');
  box.innerHTML=html;bindCards(box);
}

/* ---- Browse ---- */
function viewBrowse(){
  hideToolbar();
  const chips=BROWSE.map(b=>({...b,n: b.k==='towatch'?TOWATCH.length : b.k==='watched'?WATCHED.size : undefined}));
  showChips(chips,S.cat,k=>{S.cat=k;render();});
  const labels={all:'All New',AI:'AI',HR:'HR',Podcast:'Podcasts',News:'News',General:'General',towatch:'To Watch',watched:'Watched'};
  setHead('\uD83D\uDDC2\uFE0F '+labels[S.cat],'Latest uploads from your subscriptions, freshest first.');
  const m=document.getElementById('main');
  if(S.cat==='towatch'){m.innerHTML=listHTML(TOWATCH.slice().reverse(),'saved','\uD83D\uDD16','No saved videos','Tap \uff0b Later on any video to save it here.');bindCards();return;}
  if(S.cat==='watched'){const w=S.pool.filter(v=>WATCHED.has(v.vid));m.innerHTML=listHTML(w,'watched','\u2713','Nothing watched yet','Mark videos Watched and they appear here.');bindCards();return;}
  let list=S.pool.filter(v=>!WATCHED.has(v.vid));
  if(S.cat!=='all')list=list.filter(v=>v.cat===S.cat);
  list=list.slice(0,90);
  m.innerHTML=listHTML(list,'feed','\uD83C\uDF43','Nothing here yet','Tap Refresh, or add channels in Subs.');
  bindCards();
}

/* ---- Manage subscriptions ---- */
function viewManage(){
  hideChips();
  setHead('\u2699\uFE0F Subscriptions',`Add or remove channels. Changes are saved on your phone.`);
  showToolbar(`<input class="input" id="mIn" placeholder="Filter your channels\u2026" value="${esc(S.mq)}">`);
  const mIn=document.getElementById('mIn');mIn.oninput=()=>{S.mq=mIn.value;paintManageList();};
  const m=document.getElementById('main');
  m.innerHTML=`
    <div class="addbox">
      <b style="font-size:14px">\u2795 Add a channel</b>
      <div class="row"><input class="input" id="addIn" placeholder="Paste channel link, @handle or ID"></div>
      <div class="row">
        <select class="sel" id="addCat">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <button class="btn" id="addBtn" style="flex:1">Add channel</button>
      </div>
      <div class="note" id="addNote">Tip: open the channel on YouTube, copy its link (e.g. youtube.com/@name or .../channel/UC\u2026), and paste it here.</div>
    </div>
    <div id="mlist"></div>`;
  paintManageList();
  const addBtn=document.getElementById('addBtn'),addIn=document.getElementById('addIn'),addCat=document.getElementById('addCat'),note=document.getElementById('addNote');
  addBtn.onclick=async()=>{
    const val=addIn.value.trim();if(!val){note.textContent='Paste a channel link, @handle or ID first.';return;}
    addBtn.disabled=true;addBtn.textContent='Adding\u2026';note.textContent='Looking up the channel\u2026';
    const res=await resolveChannel(val);
    if(!res){addBtn.disabled=false;addBtn.textContent='Add channel';
      note.textContent='Couldn\u2019t find that one. Try pasting the full channel link that contains \u201c/channel/UC\u2026\u201d or the UC\u2026 ID itself.';return;}
    if(CH.some(c=>c.id===res.id)){addBtn.disabled=false;addBtn.textContent='Add channel';note.textContent='That channel is already in your list.';return;}
    REMOVED.delete(res.id);saveRemoved();
    ADDED.push({id:res.id,title:res.title,cat:addCat.value});saveAdded();rebuildCH();
    delete CACHE[res.id];saveCache();
    addIn.value='';addBtn.disabled=false;addBtn.textContent='Add channel';
    note.textContent=`Added \u201c${res.title}\u201d. Pull Refresh to load its videos.`;
    toast('Channel added');paintManageList();renderNav();
  };
  addIn.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();});
}
function paintManageList(){
  const box=document.getElementById('mlist');if(!box)return;
  const q=S.mq.trim().toLowerCase();
  let html=`<div class="status"><span class="pill">${CH.length} channels</span>${ADDED.length?`<span class="pill">${ADDED.length} added by you</span>`:''}</div>`;
  CATS.forEach(cat=>{
    let rows=CH.filter(c=>c.cat===cat&&(!q||c.title.toLowerCase().includes(q)));
    if(!rows.length)return;
    rows.sort((a,b)=>a.title.localeCompare(b.title));
    html+=`<div class="glabel"><span class="d" style="background:${catColor(cat)}"></span>${cat} \u00b7 ${rows.length}</div>`;
    html+=rows.map(c=>{const mine=ADDED.some(a=>a.id===c.id);
      return `<div class="crow"><span class="dot" style="background:${catColor(c.cat)}"></span>
        <div><b>${esc(c.title)}</b><small>${c.cat}${mine?' \u00b7 added by you':''}</small></div>
        <button class="x" data-del="${c.id}" title="Remove">\u00d7</button></div>`}).join('');
  });
  box.innerHTML=html;
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(ADDED.some(a=>a.id===id))ADDED=ADDED.filter(a=>a.id!==id),saveAdded();
    else REMOVED.add(id),saveRemoved();
    rebuildCH();S.pool=[];toast('Channel removed');paintManageList();
    document.querySelector('#main .status').innerHTML=`<span class="pill">${CH.length} channels</span>`;
  });
}

/* ---------- utils ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function timeAgo(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;
  if(s<3600)return Math.max(1,Math.floor(s/60))+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<86400*7)return Math.floor(s/86400)+'d ago';if(s<86400*30)return Math.floor(s/86400/7)+'w ago';return Math.floor(s/86400/30)+'mo ago'}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1700)}
function setMain(h){document.getElementById('main').innerHTML=h}

/* ---------- init ---------- */
document.getElementById('refreshBtn').onclick=async()=>{S.pool=[];await loadPool(true);render();};
document.getElementById('sub').textContent=`${CH.length} channels \u00b7 free \u00b7 private`;
render();
let lastCheck=Date.now();
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&Date.now()-lastCheck>5*60*1000){
    lastCheck=Date.now();if(['new','foryou','search','browse'].includes(S.view)){S.pool=[];await loadPool();render();}
  }
});
